name: Update README cards

on:
  schedule:
    - cron: '0 0 * * *'   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=synthwave&hide_border=true&include_all_commits=true
          path: generated/overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=synthwave&hide_border=true
          path: generated/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophies
        uses: ryo-ma/github-profile-trophy@main
        with:
          username: ${{ github.repository_owner }}
          theme: radical
          no-frame: true
          row: 1
          column: 6
          output: generated/trophies.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/*.svg
          git commit -m "Update README cards" || exit 0
          git push
